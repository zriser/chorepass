name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Typecheck server
        working-directory: server
        run: npx tsc --noEmit

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Typecheck web
        working-directory: web
        run: npx tsc --noEmit

  # The production image build + boot + /api/health gate lives in
  # build-validate.yml (which also promotes to `live` for auto-deploy), so a bare
  # `docker build` job here would be redundant.
